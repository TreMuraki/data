<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prudential Pacific Financial Group — Our Offices</title>

<!-- Leaflet (open-source map engine, no API key required) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
  /* ============================================================
     BRAND — tweak these to match your Framer site
     ============================================================ */
  :root {
    --brand-navy:   #0b2e4f;   /* headings, private pin */
    --brand-blue:   #007ac2;   /* Prudential blue — branch pin, buttons */
    --brand-blue-d: #00629b;
    --brand-gold:   #c9a24b;   /* accent for private offices */
    --ink:          #1c2b36;
    --ink-soft:     #5b6b78;
    --card-bg:      #ffffff;
    --page-bg:      #eef2f5;
    --radius:       14px;
    --shadow:       0 6px 24px rgba(11, 46, 79, .16), 0 2px 6px rgba(11, 46, 79, .08);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--page-bg); overflow: hidden; }

  #app { position: relative; width: 100%; height: 100vh; height: 100dvh; }
  #map { position: absolute; inset: 0; z-index: 1; background: #dfe7ec; }

  /* ============================================================
     TOP BAR — title + filter pills (atlist-style floating chrome)
     ============================================================ */
  .topbar {
    position: absolute; top: 14px; left: 14px; right: 14px; z-index: 1000;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .brand-chip {
    display: flex; align-items: center; gap: 9px;
    background: var(--card-bg); border-radius: 999px;
    padding: 8px 16px 8px 10px; box-shadow: var(--shadow);
  }
  .brand-chip .logo {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-blue), var(--brand-navy));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px;
  }
  .brand-chip .name { font-size: 13px; font-weight: 700; color: var(--brand-navy); line-height: 1.15; }
  .brand-chip .sub  { font-size: 10.5px; font-weight: 500; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }

  .filters {
    display: flex; gap: 6px; background: var(--card-bg);
    border-radius: 999px; padding: 5px; box-shadow: var(--shadow);
  }
  .filter-btn {
    border: 0; cursor: pointer; font-family: var(--font);
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    background: transparent; border-radius: 999px; padding: 7px 14px;
    display: flex; align-items: center; gap: 7px;
    transition: background .18s, color .18s;
  }
  .filter-btn:hover { background: #eef4f8; color: var(--brand-navy); }
  .filter-btn.active { background: var(--brand-navy); color: #fff; }
  .filter-btn .count {
    font-size: 10.5px; font-weight: 700; padding: 1.5px 7px; border-radius: 999px;
    background: rgba(11,46,79,.08); color: var(--ink-soft);
  }
  .filter-btn.active .count { background: rgba(255,255,255,.22); color: #fff; }
  .filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; }

  .list-toggle {
    border: 0; cursor: pointer; margin-left: auto;
    background: var(--card-bg); box-shadow: var(--shadow);
    border-radius: 999px; padding: 9px 16px;
    font-family: var(--font); font-size: 12.5px; font-weight: 600; color: var(--brand-navy);
    display: flex; align-items: center; gap: 7px;
  }
  .list-toggle:hover { background: #f4f8fb; }
  .list-toggle svg { width: 15px; height: 15px; }

  /* ============================================================
     OFFICE LIST PANEL (slides in from the left)
     ============================================================ */
  .panel {
    position: absolute; top: 74px; left: 14px; bottom: 14px; z-index: 1001;
    width: 330px; max-width: calc(100% - 28px);
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    transform: translateX(-120%); opacity: 0;
    transition: transform .28s cubic-bezier(.2,.7,.3,1), opacity .28s;
  }
  .panel.open { transform: translateX(0); opacity: 1; }
  .panel-head {
    padding: 16px 18px 12px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #edf1f4;
  }
  .panel-head h2 { font-size: 15px; color: var(--brand-navy); }
  .panel-head .close {
    border: 0; background: #f1f5f8; color: var(--ink-soft); cursor: pointer;
    width: 28px; height: 28px; border-radius: 50%; font-size: 15px; line-height: 1;
  }
  .panel-body { overflow-y: auto; padding: 10px; flex: 1; }

  .office-card {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    border: 1px solid #edf1f4; background: #fff; cursor: pointer; font-family: var(--font);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .office-card:hover { border-color: var(--brand-blue); box-shadow: 0 3px 12px rgba(0,122,194,.14); transform: translateY(-1px); }
  .office-card.active { border-color: var(--brand-blue); box-shadow: 0 0 0 2px rgba(0,122,194,.22); }
  .office-card .thumb {
    width: 44px; height: 44px; border-radius: 10px; flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px;
  }
  .office-card h3 { font-size: 13.5px; color: var(--ink); margin-bottom: 2px; }
  .office-card p  { font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
  .tag {
    display: inline-block; margin-top: 6px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .tag.branch  { background: rgba(0,122,194,.1);  color: var(--brand-blue-d); }
  .tag.private { background: rgba(201,162,75,.14); color: #8a6a24; }

  /* ============================================================
     MAP PINS
     ============================================================ */
  .pin { filter: drop-shadow(0 3px 4px rgba(11,46,79,.35)); transition: transform .15s; transform-origin: bottom center; }
  .leaflet-marker-icon:hover .pin, .leaflet-marker-icon.pin-active .pin { transform: scale(1.14); }

  /* ============================================================
     POPUP CARD (banner photo + details, atlist-style)
     ============================================================ */
  .leaflet-popup-content-wrapper { border-radius: var(--radius); box-shadow: var(--shadow); padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; width: 292px !important; font-family: var(--font); }
  .leaflet-popup-tip { box-shadow: var(--shadow); }
  .leaflet-container a.leaflet-popup-close-button {
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45);
    font-size: 20px; padding: 6px 8px 0 0;
  }

  .pop-banner { position: relative; height: 118px; background-size: cover; background-position: center; }
  .pop-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,46,79,0) 45%, rgba(11,46,79,.55)); }
  .pop-banner .banner-city {
    position: absolute; left: 14px; bottom: 10px; z-index: 2;
    color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .pop-body { padding: 14px 16px 16px; }
  .pop-body h3 { font-size: 15px; color: var(--brand-navy); line-height: 1.3; margin-bottom: 2px; }
  .pop-rows { margin-top: 10px; display: grid; gap: 8px; }
  .pop-row { display: flex; gap: 9px; font-size: 12.5px; color: var(--ink); line-height: 1.45; align-items: flex-start; }
  .pop-row svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--brand-blue); }
  .pop-row a { color: var(--ink); text-decoration: none; }
  .pop-row a:hover { color: var(--brand-blue); }

  .pop-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--font); font-size: 12px; font-weight: 700; text-decoration: none;
    border-radius: 9px; padding: 9px 10px; transition: background .15s;
  }
  .btn svg { width: 13px; height: 13px; }
  /* .leaflet-container prefix beats Leaflet's default popup link color */
  .leaflet-container a.btn-primary { background: var(--brand-blue); color: #fff; }
  .leaflet-container a.btn-primary:hover { background: var(--brand-blue-d); }
  .leaflet-container a.btn-ghost { background: #eef4f8; color: var(--brand-navy); }
  .leaflet-container a.btn-ghost:hover { background: #e2ecf3; }

  .leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 10px !important; overflow: hidden; }
  .leaflet-control-zoom a { color: var(--brand-navy) !important; }
  .leaflet-control-attribution { font-size: 9px !important; background: rgba(255,255,255,.75) !important; }

  /* ============================================================
     MOBILE
     ============================================================ */
  @media (max-width: 560px) {
    .topbar { gap: 8px; }
    .brand-chip .sub { display: none; }
    .filter-btn { padding: 7px 11px; font-size: 12px; }
    .filter-btn .count { display: none; }
    .list-toggle span { display: none; }
    .list-toggle { padding: 10px; }
    .panel { top: auto; bottom: 0; left: 0; right: 0; width: 100%; max-width: 100%; max-height: 55%; border-radius: var(--radius) var(--radius) 0 0; transform: translateY(120%); }
    .panel.open { transform: translateY(0); }
    .leaflet-popup-content { width: 258px !important; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <div class="topbar">
    <div class="brand-chip">
      <div class="logo">P</div>
      <div>
        <div class="name">Pacific Financial Group</div>
        <div class="sub">Office Locations</div>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <button class="list-toggle" id="listToggle" aria-label="Toggle office list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>Office list</span>
    </button>
  </div>

  <aside class="panel" id="panel" aria-label="Office list">
    <div class="panel-head">
      <h2>Our Offices</h2>
      <button class="close" id="panelClose" aria-label="Close list">&times;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<script>
/* ==============================================================
   OFFICE DATA — this is the only section you need to edit.

   tag:    "branch" or "private" (drives pin color, tag chip, filters)
   photo:  URL of a banner image (~600×250px works well). Leave ""
           to show a branded gradient banner instead. In Framer you
           can upload a photo to any page, copy its asset URL, and
           paste it here.
   coords: [latitude, longitude] — grab exact ones from Google Maps
           (right-click the building → click the numbers to copy).
   ============================================================== */
const OFFICES = [
  {
    id: "honolulu",
    name: "Honolulu Branch",
    city: "Honolulu, HI",
    tag: "branch",
    address: "1003 Bishop Street, Suite 1910",
    cityStateZip: "Honolulu, HI 96813",
    phone: "(808) 545-2225",
    photo: "",
    coords: [21.3095, -157.8610],
  },
  {
    id: "roseville",
    name: "Roseville Branch",
    city: "Roseville, CA",
    tag: "branch",
    address: "2998 Douglas Blvd, Suite 200",
    cityStateZip: "Roseville, CA 95661",
    phone: "", // TODO: add the Roseville office phone number
    photo: "",
    coords: [38.7460, -121.2560],
  },
  {
    id: "san-jose",
    name: "San Jose Branch",
    city: "San Jose, CA",
    tag: "branch",
    address: "1731 Technology Drive, Suite 600",
    cityStateZip: "San Jose, CA 95110",
    phone: "(408) 452-1300",
    photo: "",
    coords: [37.3770, -121.9230],
  },
  {
    id: "lake-oswego",
    name: "Lake Oswego Branch",
    city: "Lake Oswego, OR",
    tag: "branch",
    address: "5500 SW Meadows Road, Suite 175",
    cityStateZip: "Lake Oswego, OR 97035",
    phone: "(503) 746-2177",
    photo: "",
    coords: [45.4148, -122.7218],
  },
  {
    id: "mercer-island",
    name: "Mercer Island Branch",
    city: "Mercer Island, WA",
    tag: "branch",
    address: "7900 SE 28th Street, Suite 300", // TODO: verify suite number
    cityStateZip: "Mercer Island, WA 98040",
    phone: "", // TODO: add the Mercer Island office phone number
    photo: "",
    coords: [47.5852, -122.2326],
  },

  /* ---- PRIVATE OFFICES — uncomment and duplicate when ready ----
  {
    id: "example-private",
    name: "Example Private Office",
    city: "City, ST",
    tag: "private",
    address: "123 Main Street, Suite 100",
    cityStateZip: "City, ST 00000",
    phone: "(000) 000-0000",
    photo: "",
    coords: [0, 0],
  },
  --------------------------------------------------------------- */
];

/* Tag appearance — add more tags here if you ever need them */
const TAGS = {
  branch:  { label: "Branch",  color: "#007ac2", gradient: ["#007ac2", "#0b2e4f"] },
  private: { label: "Private", color: "#c9a24b", gradient: ["#c9a24b", "#7a5c1e"] },
};

/* ==============================================================
   MAP SETUP
   ============================================================== */
const map = L.map("map", { zoomControl: false, attributionControl: true });
L.control.zoom({ position: "bottomright" }).addTo(map);

// Clean, light basemap (free CARTO tiles — the same minimal look atlist uses)
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: "abcd",
  maxZoom: 19,
}).addTo(map);

/* ==============================================================
   PINS
   ============================================================== */
function pinSVG(color) {
  return `
    <svg class="pin" width="34" height="44" viewBox="0 0 34 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 43C17 43 32 26.6 32 15.9 32 7.1 25.3 1 17 1S2 7.1 2 15.9C2 26.6 17 43 17 43Z"
            fill="${color}" stroke="#ffffff" stroke-width="2"/>
      <g transform="translate(9.5, 8.5)" fill="#ffffff">
        <rect x="1.5" y="3.5" width="12" height="10.5" rx="1"/>
        <rect x="4"   y="0.5" width="7"  height="3.5" rx="1"/>
        <rect x="3.6" y="5.6" width="2.2" height="2.2" rx=".4" fill="${color}"/>
        <rect x="6.9" y="5.6" width="2.2" height="2.2" rx=".4" fill="${color}"/>
        <rect x="10.2" y="5.6" width="2.2" height="2.2" rx=".4" fill="${color}"/>
        <rect x="3.6" y="9" width="2.2" height="2.2" rx=".4" fill="${color}"/>
        <rect x="10.2" y="9" width="2.2" height="2.2" rx=".4" fill="${color}"/>
        <rect x="6.7" y="9" width="2.6" height="5" rx=".5" fill="${color}"/>
      </g>
    </svg>`;
}

function makeIcon(tag) {
  return L.divIcon({
    className: "office-pin",
    html: pinSVG((TAGS[tag] || TAGS.branch).color),
    iconSize: [34, 44],
    iconAnchor: [17, 43],
    popupAnchor: [0, -46],
  });
}

/* ==============================================================
   POPUP CARD
   ============================================================== */
const ICONS = {
  pin:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.5 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>',
  route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19.5 3.5 12 9 4.5M3.5 12H15a5 5 0 0 1 5 5v2.5" transform="rotate(180 12 12)"/></svg>',
};

function bannerStyle(o) {
  if (o.photo) return `background-image:url('${o.photo}')`;
  const [c1, c2] = (TAGS[o.tag] || TAGS.branch).gradient;
  return `background-image:
      radial-gradient(circle at 82% 18%, rgba(255,255,255,.22) 0, rgba(255,255,255,0) 42%),
      radial-gradient(circle at 12% 95%, rgba(255,255,255,.14) 0, rgba(255,255,255,0) 38%),
      linear-gradient(128deg, ${c1}, ${c2})`;
}

function directionsURL(o) {
  const q = encodeURIComponent(`${o.address}, ${o.cityStateZip}`);
  return `https://www.google.com/maps/dir/?api=1&destination=${q}`;
}

function popupHTML(o) {
  const tagInfo = TAGS[o.tag] || TAGS.branch;
  const phoneRow = o.phone
    ? `<div class="pop-row">${ICONS.phone}<a href="tel:${o.phone.replace(/[^+\d]/g, "")}">${o.phone}</a></div>`
    : "";
  const callBtn = o.phone
    ? `<a class="btn btn-ghost" href="tel:${o.phone.replace(/[^+\d]/g, "")}">${ICONS.phone} Call</a>`
    : "";
  return `
    <div class="pop-banner" style="${bannerStyle(o)}">
      <span class="banner-city">${o.city}</span>
    </div>
    <div class="pop-body">
      <h3>${o.name}</h3>
      <span class="tag ${o.tag}">${tagInfo.label} office</span>
      <div class="pop-rows">
        <div class="pop-row">${ICONS.pin}<span>${o.address}<br>${o.cityStateZip}</span></div>
        ${phoneRow}
      </div>
      <div class="pop-actions">
        <a class="btn btn-primary" href="${directionsURL(o)}" target="_blank" rel="noopener">${ICONS.route} Directions</a>
        ${callBtn}
      </div>
    </div>`;
}

/* ==============================================================
   MARKERS + LIST + FILTERS
   ============================================================== */
const markers = {};   // office id -> Leaflet marker
let activeFilter = "all";

OFFICES.forEach((o) => {
  const m = L.marker(o.coords, { icon: makeIcon(o.tag), title: o.name, riseOnHover: true })
    .bindPopup(popupHTML(o), { maxWidth: 320, closeButton: true });
  m.on("click", () => setActiveCard(o.id));
  m.on("popupopen", () => m.getElement()?.classList.add("pin-active"));
  m.on("popupclose", () => { m.getElement()?.classList.remove("pin-active"); setActiveCard(null); });
  markers[o.id] = m;
});

function visibleOffices() {
  return OFFICES.filter((o) => activeFilter === "all" || o.tag === activeFilter);
}

function fitToVisible(animate) {
  const pts = visibleOffices().map((o) => o.coords);
  if (!pts.length) return;
  map.fitBounds(L.latLngBounds(pts), { padding: [70, 70], maxZoom: 11, animate: !!animate });
}

function applyFilter(filter) {
  activeFilter = filter;
  map.closePopup();
  OFFICES.forEach((o) => {
    const show = filter === "all" || o.tag === filter;
    if (show && !map.hasLayer(markers[o.id])) markers[o.id].addTo(map);
    if (!show && map.hasLayer(markers[o.id])) map.removeLayer(markers[o.id]);
  });
  renderFilters();
  renderList();
  fitToVisible(true);
}

function renderFilters() {
  const tagsInUse = [...new Set(OFFICES.map((o) => o.tag))];
  const el = document.getElementById("filters");
  const btn = (key, label, count, dotColor) => `
    <button class="filter-btn ${activeFilter === key ? "active" : ""}" data-filter="${key}">
      ${dotColor ? `<span class="dot" style="background:${dotColor}"></span>` : ""}
      ${label}<span class="count">${count}</span>
    </button>`;
  el.innerHTML =
    btn("all", "All", OFFICES.length, null) +
    tagsInUse.map((t) => btn(t, TAGS[t]?.label || t, OFFICES.filter((o) => o.tag === t).length, TAGS[t]?.color)).join("");
  el.querySelectorAll(".filter-btn").forEach((b) =>
    b.addEventListener("click", () => applyFilter(b.dataset.filter)));
}

function renderList() {
  const body = document.getElementById("panelBody");
  body.innerHTML = visibleOffices().map((o) => {
    const tagInfo = TAGS[o.tag] || TAGS.branch;
    const initials = o.city.split(",")[0].split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    return `
      <button class="office-card" data-id="${o.id}" id="card-${o.id}">
        <div class="thumb" style="background:linear-gradient(135deg, ${tagInfo.gradient[0]}, ${tagInfo.gradient[1]})">${initials}</div>
        <div>
          <h3>${o.name}</h3>
          <p>${o.address}<br>${o.cityStateZip}</p>
          <span class="tag ${o.tag}">${tagInfo.label}</span>
        </div>
      </button>`;
  }).join("");
  body.querySelectorAll(".office-card").forEach((card) =>
    card.addEventListener("click", () => focusOffice(card.dataset.id)));
}

function setActiveCard(id) {
  document.querySelectorAll(".office-card").forEach((c) =>
    c.classList.toggle("active", c.dataset.id === id));
}

function focusOffice(id) {
  const o = OFFICES.find((x) => x.id === id);
  if (!o) return;
  setActiveCard(id);
  if (window.matchMedia("(max-width: 560px)").matches) togglePanel(false);
  map.flyTo(o.coords, Math.max(map.getZoom(), 12), { duration: 0.8 });
  map.once("moveend", () => markers[id].openPopup());
}

/* ==============================================================
   LIST PANEL TOGGLE
   ============================================================== */
const panel = document.getElementById("panel");
function togglePanel(force) {
  panel.classList.toggle("open", force !== undefined ? force : !panel.classList.contains("open"));
}
document.getElementById("listToggle").addEventListener("click", () => togglePanel());
document.getElementById("panelClose").addEventListener("click", () => togglePanel(false));

/* ==============================================================
   INIT
   ============================================================== */
applyFilter("all"); // adds markers, renders filters + list, fits bounds
// Open the list by default on wide screens, like atlist
if (window.matchMedia("(min-width: 900px)").matches) togglePanel(true);
</script>
</body>
</html>
